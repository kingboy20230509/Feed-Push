services:
  telegram-rss-bot:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        REQUIREMENTS_FILE: ${REQUIREMENTS_FILE:-requirements.txt}
    image: feed-push:local
    container_name: telegram-rss-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    volumes:
      - ./data:/app/data
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?请在.env中填写Bot Token}
      ROOT_ID: ${ROOT_ID:?请在.env中填写管理员ID}
      WHITELIST_GROUP_ID: ${WHITELIST_GROUP_ID:--123456}
      ENABLE_GROUP_VERIFY: ${ENABLE_GROUP_VERIFY:-false}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-300}
      DATA_DIR: /app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
