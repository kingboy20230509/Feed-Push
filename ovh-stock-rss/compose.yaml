services:
  ovh-rss:
    build: .
    restart: unless-stopped
    environment:
      OVH_WATCH: ${OVH_WATCH:-}
      OVH_DATACENTERS: ${OVH_DATACENTERS:-}
      POLL_SECONDS: ${POLL_SECONDS:-60}
    volumes:
      - state:/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8787}:8787"

volumes:
  state:
